# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  shopping.api:
    container_name: shoppingapi
    image: shoppingapi
    ports:
      - "5002:5002"
    build:
      context: .
      dockerfile: Shopping/Shopping.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings:ConnectionString=mongodb://shoppingdb:27017"
    depends_on:
      - shopping.db

  shopping.client:
    container_name: shoppingclient
    image: shoppingclient
    ports:
      - "5001:5001"
    build:
      context: .
      dockerfile: Shopping/Shopping.Client/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ShoppingAPIUrl=http://shoppingapi:5002"
    depends_on:
      - shopping.db
      
  shopping.db:
    container_name: shoppingdb
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data:
